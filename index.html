<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server wird gestartet....</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050505;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(40, 167, 69, 0.2), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(20, 80, 35, 0.15), transparent 50%);
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(15, 20, 15, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(40, 167, 69, 0.3);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8),
                  0 0 20px 0 rgba(40, 167, 69, 0.25);
      max-width: 100%;
      width: 380px;
      transition: all 0.3s ease;
    }
    h2 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #28a745 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .spinner {
      position: relative;
      width: 60px;
      height: 60px;
      border: 3px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      border-top-color: #28a745;
      border-right-color: #1e7e34;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      margin: 25px auto;
      box-shadow: 0 0 15px rgba(40, 167, 69, 0.4);
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #status {
      font-size: 15px;
      line-height: 1.6;
      color: #a3b8a5;
      margin-top: 15px;
    }
    .error-icon {
      font-size: 40px;
      margin-bottom: 10px;
      display: block;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Server Status 🚀</h2>
  <div class="spinner" id="loader"></div>
  <p id="status">Sende Start-Signal in die Cloud...</p>
  <div id="actionArea"></div>
</div>

<script>
  // WICHTIG: Hier deine Daten eintragen!
  const GITHUB_USER = "VisionXRV";
  const REPO_NAME = "mc-server-waker";
  
  // Platzhalter für den Link zur Startseite
  const STARTSEITEN_LINK = "https://visionxrv.github.io/Arsch-Attack/finish"; 

  // Token-Aufteilung
  const PART1 = "ghp_OxwttUMCl9XDBVVVvwKO";
  const PART2 = "wMyK37dIJD0QtuMs";
  const TOKEN = PART1 + PART2;

  window.onload = function() {
    const status = document.getElementById("status");
    const loader = document.getElementById("loader");

    fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/dispatches`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${TOKEN}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ event_type: "wake_server" })
    })
    .then(response => {
      if (response.ok || response.status === 204) {
        // Direkt zur Webseite weiterleiten
        window.location.href = STARTSEITEN_LINK;
      } else {
        loader.style.display = "none";
        status.innerHTML = "<span class='error-icon'>❌</span>Es ist ein Fehler aufgetreten, versuchen Sie es später.<br><br>Falls das Problem weiterhin besteht, kontaktiere bitte Carlos.";
      }
    })
    .catch(err => {
      loader.style.display = "none";
      status.innerHTML = "<span class='error-icon'>❌</span>Es ist ein Fehler aufgetreten, versuchen Sie es später.<br><br>Falls das Problem weiterhin besteht, kontaktiere bitte Carlos.";
    });
  };
</script>

</body>
</html>
