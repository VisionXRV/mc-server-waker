name: Wake Up Server

on:
  workflow_dispatch:
  repository_dispatch:
    types: [wake_server]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: node bot.js
